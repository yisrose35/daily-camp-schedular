<style>
/* ── PIN overlay ─────────────────────────────────────────────────────────
   Default state assumes LOCKED (overlay visible, register hidden) so there
   is never a flash of the selling console before the synchronous check
   below runs. The check removes html.pos-locked the moment it finds a
   usable session, before the body paints. */
html.pos-locked .app { display: none; }
#pinOverlay { display: none; }
html.pos-locked #pinOverlay { display: flex; }
#pinOverlay {
    position: fixed; inset: 0; z-index: 999999;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg,#0F172A,#1E293B);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
}
#pinOverlay .pin-card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 34px 30px 30px; box-sizing: border-box;
}
#pinOverlay .pin-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
#pinOverlay .pin-brand img { height: 40px; width: auto; }
#pinOverlay .pin-brand-title { font-size: 1.05rem; font-weight: 700; color: #0F172A; }
#pinOverlay .pin-brand-sub { font-size: .82rem; color: #64748B; text-align: center; }
#pinOverlay .pin-field { margin-bottom: 14px; }
#pinOverlay label { display: block; font-size: .74rem; font-weight: 600; color: #475569; margin-bottom: 6px; letter-spacing: .02em; text-transform: uppercase; }
#pinOverlay input {
    width: 100%; box-sizing: border-box; font-size: 1rem;
    padding: 12px 14px; border: 2px solid #E2E8F0; border-radius: 12px;
    font-weight: 600; color: #0F172A; background: #F8FAFC; font-family: inherit;
}
#pinOverlay input#pinInputEl { letter-spacing: .4rem; text-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
#pinOverlay input:focus { outline: none; border-color: #147D91; background: #fff; }
#pinOverlay .pin-err {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px;
    background: #FEF2F2; color: #DC2626; font-size: .85rem; line-height: 1.4; text-align: center;
}
#pinOverlay .pin-err.show { display: block; }
#pinOverlay button {
    width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 12px;
    background: #0F5F6E; color: #fff; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .15s;
}
#pinOverlay button:hover:not(:disabled) { background: #0A4A56; }
#pinOverlay button:disabled { opacity: .55; cursor: default; }
#pinOverlay .pin-foot { margin-top: 18px; text-align: center; font-size: .75rem; color: #94A3B8; }
</style>
<script>
// ── Login gate ───────────────────────────────────────────────────────────
// snacks.campistry.org has no path back into the rest of Campistry, so a
// real session is required here on its own — nothing carries over from
// another Campistry subdomain (separate origin, separate localStorage).
// This runs synchronously in <head>, before the body ever paints. Instead
// of redirecting to a separate page, it just decides whether html carries
// pos-locked — the CSS above hides the selling console and shows the PIN
// overlay (built inline below) until a usable session shows up. Fails
// CLOSED, deliberately unlike the fail-open product/section guards later
// in this file, since the whole point here is "people can't just get on."
// The real security boundary is still Supabase RLS on the other side of
// that session, not this check.
document.documentElement.classList.add('pos-locked');
(function () {
    try {
        var cfg = window.__CAMPISTRY_SUPABASE__;
        var ref = cfg && cfg.url && (cfg.url.match(/^https?:\/\/([^.]+)\./) || [])[1];
        var ok = false;
        if (ref) {
            var raw = localStorage.getItem('sb-' + ref + '-auth-token');
            if (raw) {
                var parsed = JSON.parse(raw);
                var session = (parsed && (parsed.currentSession || parsed)) || null;
                var expiresAt = session && session.expires_at;
                ok = !!(session && session.access_token && (!expiresAt || expiresAt * 1000 > Date.now()));
            }
        }
        if (ok) document.documentElement.classList.remove('pos-locked');
    } catch (e) { /* stay locked */ }
})();
</script>
</head>
<body>

<!-- PIN LOGIN OVERLAY — covers the register until a real session exists.
     Lives on this same page (no separate login page/route): the register
     itself is what a runner sees the moment the right PIN is entered. -->
<div id="pinOverlay">
    <div class="pin-card">
        <div class="pin-brand">
            <img src="Campistry_logo.png" alt="Campistry">
            <div class="pin-brand-title">Snacks — Register Login</div>
            <div class="pin-brand-sub">Sign in with the camp's Campistry email and the register PIN.</div>
        </div>

        <div id="pinForm">
            <div class="pin-field">
                <label for="pinEmailEl">Campistry Email</label>
                <input type="email" id="pinEmailEl" autocomplete="username" placeholder="owner@example.com">
            </div>
            <div class="pin-field">
                <label for="pinInputEl">Register PIN</label>

            </div>
            <div class="pin-err" id="pinErrBox"></div>
            <button id="pinSubmitBtn">Unlock Register</button>
        </div>

        <div class="pin-foot">Only for staff running the canteen register.</div>
    </div>
</div>

<script>
// ── PIN overlay logic — same page as the register, no separate route.
// Login is the same email used for the camp's real Campistry account,
// plus the register PIN standing in for a password (see pos-pin-login's
// comment header — this is NOT the real account password and can never
// reach the real account). The email field is remembered locally purely
// as a typing convenience — it isn't a secret, and the PIN is still
// required every single time.
(function () {
    'use strict';

    var REMEMBERED_EMAIL_KEY = 'campistry_pos_last_email';

    var emailInput = document.getElementById('pinEmailEl');
    var pinInput = document.getElementById('pinInputEl');
    var errBox = document.getElementById('pinErrBox');
    var submitBtn = document.getElementById('pinSubmitBtn');

    try {
        var rememberedEmail = localStorage.getItem(REMEMBERED_EMAIL_KEY);
        if (rememberedEmail) emailInput.value = rememberedEmail;
    } catch (e) {}

    function showErr(msg) { errBox.textContent = msg; errBox.classList.add('show'); }
    function clearErr() { errBox.classList.remove('show'); errBox.textContent = ''; }

    pinInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
        clearErr();
    });
    [emailInput, pinInput].forEach(function (el) {
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPin(); });
        el.addEventListener('input', clearErr);
    });

    // supabase-js's functions.invoke() collapses every non-2xx response into
    // a generic error — the real { error: "..." } body pos-pin-login returns
    // lives on res.error.context instead. Same unwrap pattern used elsewhere
    // in this app (campistry_snacks.js's _edgeFnErrorMessage).
    function unwrap(res) {
        var data = res && res.data;
        if (data && (data.access_token || data.error)) return Promise.resolve(data);
        var err = res && res.error;
        if (err && err.context && typeof err.context.json === 'function') {
            return err.context.json().catch(function () { return { error: (err && err.message) || 'Could not log in.' }; });
        }
        return Promise.resolve({ error: (err && err.message) || 'Could not log in.' });
    }

    function submitPin() {
        var db = window.CampistryDB;
        var client = db && db.getClient && db.getClient();
        if (!client) { showErr('Not ready yet — try again in a moment.'); return; }
        var email = (emailInput.value || '').trim();
        var pin = (pinInput.value || '').trim();
        if (!email) { showErr('Enter the email address.'); emailInput.focus(); return; }
        if (pin.length < 4) { showErr('Enter the PIN.'); pinInput.focus(); return; }
        clearErr();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking…';

        // Capital P is deliberate — the deployed Supabase function slug is
        // "Pos-pin-login" (not the repo folder's lowercase name), and this
        // path is case-sensitive. Keep this in sync with whatever the
        // Supabase Dashboard actually shows under Edge Functions.
        client.functions.invoke('Pos-pin-login', { body: { email: email, pin: pin } })
            .then(unwrap)
            .then(function (data) {
                if (!data || !data.access_token) throw new Error((data && data.error) || 'Could not log in.');
                return client.auth.setSession({ access_token: data.access_token, refresh_token: data.refresh_token })
                    .then(function () {
                        try { localStorage.setItem(REMEMBERED_EMAIL_KEY, email); } catch (e) {}
                        window.location.reload();
                    });
            })
            .catch(function (e) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unlock Register';
                pinInput.value = '';
                pinInput.focus();
                showErr((e && e.message) || 'Could not log in. Try again.');
            });
    }

    submitBtn.addEventListener('click', submitPin);
    if (document.documentElement.classList.contains('pos-locked')) {
        (emailInput.value ? pinInput : emailInput).focus();
    }
})();
</script>
</body>
