<!DOCTYPE html>
<html lang="en" data-product="lite">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Campistry Lite</title>
    <link rel="icon" type="image/png" href="Campistry_logo.png">

    <!-- PWA / add-to-home-screen -->
    <link rel="manifest" href="manifest_lite.webmanifest">
    <meta name="theme-color" content="#EE6A53">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Campistry">
    <link rel="apple-touch-icon" href="Campistry_logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700;8..144,900&display=swap" rel="stylesheet">

    <!-- FOUC prevention (same pattern as index/dashboard) -->
    <!-- Resolve the theme before first paint so the app never flashes the wrong
         one. Mirrors colorSchemePref() in campistry_lite.js. -->
    <script>(function(){try{var p=JSON.parse(localStorage.getItem('campistry_lite_prefs')||'{}');var c=p.colorScheme||'auto';var r=document.documentElement;if(c!=='auto')r.setAttribute('data-theme',c);r.style.colorScheme=c==='auto'?'light dark':c;}catch(e){}})();</script>
    <style>html:not(.css-ready) body { opacity: 0; } html.css-ready body { transition: opacity 0.15s ease; }</style>
    <link rel="stylesheet" href="campistry-unified.css?v=20260830-18">
    <link rel="stylesheet" href="campistry_lite.css?v=20260830-18" onload="document.documentElement.classList.add('css-ready')">
    <noscript><style>html body { opacity: 1 !important; }</style></noscript>
</head>
<body>

    <!-- Boot / auth splash. Bare on purpose: the logo sits as a faint outline
         and fills in as each boot stage lands, so the mark itself IS the
         progress indicator. Nothing else on the screen. -->
    <div id="liteSplash" class="lite-splash">
        <div class="lite-splash-inner">
            <span class="lite-splash-logo" id="liteSplashLogo" role="progressbar"
                  aria-label="Loading Campistry Lite" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span>
            <!-- Left empty on purpose: filled only if the launch runs long, so a
                 fast open never flashes a message at you. -->
            <div class="lite-splash-status" id="liteSplashStatus"></div>
        </div>
    </div>

    <!-- App shell (hidden until authenticated + hydrated) -->
    <div id="liteApp" class="lite-app" data-screen="home" style="display:none;">

        <header class="lite-header" id="liteHeader">
            <button class="lite-back" id="liteBackBtn" aria-label="Back to home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="lite-header-titles">
                <div class="lite-header-title" id="liteHeaderTitle">Campistry <span>Lite</span></div>
                <div class="lite-header-sub" id="liteHeaderSub"></div>
            </div>
            <button class="lite-avatar" id="liteMenuBtn" aria-label="Account menu"><span id="liteAvatarInitials">·</span></button>
        </header>

        <!-- Overflow menu -->
        <div class="lite-menu" id="liteMenu" style="display:none;">
            <div class="lite-menu-head">
                <div class="lite-menu-avatar" id="liteMenuAvatar">·</div>
                <div class="lite-menu-id">
                    <div class="lite-menu-user" id="liteMenuUser"></div>
                    <div class="lite-menu-role"><span class="lite-role-badge" id="liteRoleBadge"></span></div>
                </div>
            </div>
            <button class="lite-menu-item" id="liteMenuSettings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </button>
            <a href="dashboard.html" class="lite-menu-item" id="liteMenuDashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
                Open full Campistry
            </a>
            <button class="lite-menu-item lite-menu-danger" id="liteSignOut">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign out
            </button>
        </div>

        <main class="lite-main" id="liteMain">
            <!-- Home launcher -->
            <section class="lite-view lite-home" id="view-home"></section>
            <!-- Settings (chrome, not a Lite app) -->
            <section class="lite-view" id="view-settings" style="display:none;"></section>
            <!-- App views -->
            <section class="lite-view" id="view-today" style="display:none;"></section>
            <section class="lite-view" id="view-locate" style="display:none;"></section>
            <section class="lite-view" id="view-reports" style="display:none;"></section>
            <section class="lite-view" id="view-roster" style="display:none;"></section>
            <section class="lite-view" id="view-meRoster" style="display:none;"></section>
            <section class="lite-view" id="view-meMedical" style="display:none;"></section>
            <section class="lite-view" id="view-meStaff" style="display:none;"></section>
            <section class="lite-view" id="view-liveRoll" style="display:none;"></section>
            <section class="lite-view" id="view-liveChanges" style="display:none;"></section>
            <section class="lite-view" id="view-healthMeds" style="display:none;"></section>
            <section class="lite-view" id="view-healthRoster" style="display:none;"></section>
            <section class="lite-view" id="view-healthTrip" style="display:none;"></section>
            <section class="lite-view" id="view-linkMessages" style="display:none;"></section>
            <section class="lite-view" id="view-linkCompose" style="display:none;"></section>
            <section class="lite-view" id="view-notesList" style="display:none;"></section>
            <section class="lite-view" id="view-league" style="display:none;"></section>
            <section class="lite-view" id="view-staff" style="display:none;"></section>
            <section class="lite-view" id="view-messaging" style="display:none;"></section>
            <section class="lite-view" id="view-tips" style="display:none;"></section>
            <section class="lite-view" id="view-announcements" style="display:none;"></section>
            <section class="lite-view" id="view-transport" style="display:none;"></section>
        </main>

        <nav class="lite-tabbar" id="liteTabbar">
            <!-- Tabs injected by campistry_lite.js when an app is open -->
        </nav>

        <!-- Floating "new note" button (Notes Lite) — lives outside the animated
             views so its position:fixed stays viewport-relative. -->
        <button class="lite-fab" id="liteNoteNew" aria-label="New note" style="display:none;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
    </div>

    <!-- Toast -->
    <div class="lite-toast" id="liteToast" style="display:none;"></div>

    <!-- Pickup alerts — a small stack above whatever page is active, one
         card per unresolved alert addressed to this login (see
         campistry_lite.js renderPickupAlerts()). -->
    <div id="litePickupAlerts" class="lite-pickup-alerts"></div>

    <!-- ===== Core stack (order matters: config → SDK → client → RBAC → data) ===== -->
    <script src="config.js?v=20260830-18"></script>
    <script>
        // Non-blocking SDK loader (same pattern as flow.html): load the Supabase
        // SDK, then supabase_client.js in its onload so init order is guaranteed.
        (function () {
            var s = document.createElement('script');
            // The native app (Capacitor) bundles its own copy: a CDN fetch at
            // boot would mean a dead app on bad camp reception, and it's the
            // one request that has to succeed before anything renders.
            var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
            s.src = (native || window.location.protocol === 'file:')
                ? 'supabase-js@2.js'
                : 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            s.onload = function () {
                var chain = [
                    'supabase_client.js',
                    'access_control.js',
                    'supabase_permissions.js',
                    'supabase_schedules.js',
                    'division_times_system.js',
                    'rotation_cloud.js',
                    'campistry_visibility.js',
                    'campistry_lite_biometric.js',
                    'campistry_bio_native.js',       // native biometrics bridge; no-op on web
                    'campistry_haptics.js',
                    'campistry_push.js',
                    'campistry_keyboard.js',
                    'campistry_lite_capacitor.js',   // native shell glue; no-op on the web
                    // Same reasoning as the supabase-js bundling above — this is
                    // the roll-call bubble-sheet scan, exactly the offline/bad-
                    // reception scenario the rest of this boot chain was
                    // hardened for, so it can't be the one entry still fetched
                    // from a CDN on native.
                    (native || window.location.protocol === 'file:')
                        ? 'jsqr@1.4.0.js'
                        : 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',
                    'campistry_lite.js',
                    'campistry_ota.js'               // LAST: confirms the bundle booted (live updates)
                ];
                (function next(i) {
                    if (i >= chain.length) return;
                    var t = document.createElement('script');
                    t.src = chain[i];
                    t.onload = function () { next(i + 1); };
                    t.onerror = function () {
                        console.error('[Lite] Failed to load ' + chain[i]);
                        next(i + 1);
                    };
                    document.body.appendChild(t);
                })(0);
            };
            s.onerror = function () {
                var el = document.getElementById('liteSplashStatus');
                if (el) el.textContent = 'Could not reach the network. Check your connection and reload.';
            };
            document.body.appendChild(s);
        })();
    </script>
</body>
</html>
