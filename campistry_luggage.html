<!DOCTYPE html>
<html lang="en" data-product="luggage">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campistry Luggage — Bags to Camp</title>
<link rel="icon" type="image/png" href="Campistry_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="campistry-unified.css">
<link rel="stylesheet" href="campistry_ops.css">
</head>
<body data-ops="luggage">

<!-- HEADER -->
<header class="app-header">
    <div class="header-left">
        <a href="dashboard.html" class="header-back">&larr; Dashboard</a>
        <a href="campistry_me.html" class="header-app-switch" title="Campistry Me"><img src="Me_clean.png" alt="Me" style="height:36px;width:auto;object-fit:contain;"></a>
        <a href="campistry_go.html" class="header-app-switch" title="Campistry Go"><img src="Go_clean.png" alt="Go" style="height:36px;width:auto;object-fit:contain;"></a>
        <a href="campistry_shop.html" class="header-app-switch" title="Camp Shop">🛍️</a>
    </div>
    <div class="header-right">
        <div class="sync-badge"><div class="sync-dot"></div><span>Synced</span></div>
    </div>
</header>

<main class="ops-main">
    <div class="ops-hero">
        <div class="ops-hero-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="13" x2="21" y2="13"/></svg>
        </div>
        <div>
            <h1>Luggage</h1>
            <p>Bags to camp and home — bookings, tags, trucks and bunk delivery</p>
        </div>
        <div class="ops-hero-actions">
            <button class="ops-btn" onclick="lugExportCSV()">↓ Export</button>
            <button class="ops-btn ops-btn--pri" onclick="lugNewBooking()">+ New Booking</button>
        </div>
    </div>

    <div class="ops-tabs" id="lugTabs"></div>
    <div id="lugBody"></div>
</main>

<!-- BOOKING EDITOR -->
<div class="ops-overlay" id="m-booking"><div class="ops-modal ops-modal--lg">
    <div class="ops-modal-head"><h2 id="bkTitle">New Booking</h2><button class="ops-x" onclick="lugClose('booking')">&times;</button></div>
    <div class="ops-modal-body" id="bkBody"></div>
    <div class="ops-modal-foot">
        <button class="ops-btn" onclick="lugClose('booking')">Cancel</button>
        <button class="ops-btn ops-btn--pri" onclick="lugSaveBooking()">Save Booking</button>
    </div>
</div></div>

<!-- LOCATION EDITOR -->
<div class="ops-overlay" id="m-location"><div class="ops-modal">
    <div class="ops-modal-head"><h2 id="locTitle">Drop-off Location</h2><button class="ops-x" onclick="lugClose('location')">&times;</button></div>
    <div class="ops-modal-body" id="locBody"></div>
    <div class="ops-modal-foot">
        <button class="ops-btn" onclick="lugClose('location')">Cancel</button>
        <button class="ops-btn ops-btn--pri" onclick="lugSaveLocation()">Save Location</button>
    </div>
</div></div>

<!-- PRICING -->
<div class="ops-overlay" id="m-pricing"><div class="ops-modal">
    <div class="ops-modal-head"><h2>Pricing &amp; Camp Details</h2><button class="ops-x" onclick="lugClose('pricing')">&times;</button></div>
    <div class="ops-modal-body" id="pricingBody"></div>
    <div class="ops-modal-foot">
        <button class="ops-btn" onclick="lugClose('pricing')">Cancel</button>
        <button class="ops-btn ops-btn--pri" onclick="lugSavePricing()">Save</button>
    </div>
</div></div>

<!-- SCAN -->
<div class="ops-overlay" id="m-scan"><div class="ops-modal">
    <div class="ops-modal-head"><h2>Scan Bags</h2><button class="ops-x" onclick="lugClose('scan')">&times;</button></div>
    <div class="ops-modal-body" id="scanBody"></div>
    <div class="ops-modal-foot">
        <button class="ops-btn" onclick="lugClose('scan')">Close</button>
        <button class="ops-btn ops-btn--pri" onclick="lugRunScan()">Apply</button>
    </div>
</div></div>

<div class="ops-toast" id="lugToast"></div>

<script src="demo_mode.js"></script>
<script src="config.js"></script>
<script src="supabase-js@2.js"></script>
<script src="supabase_client.js"></script>
<script src="campistry_security.js"></script>
<script src="local_cache_idb.js"></script>
<script src="integration_hooks.js"></script>
<script src="campistry_payments.js"></script>
<script src="campistry_luggage_core.js"></script>
<script src="campistry_luggage.js"></script>
<script>window.__CAMPISTRY_PRODUCT__='luggage';</script>
<script src="parent_lockout_guard.js"></script>
<script src="product_access_guard.js"></script>
</body>
</html>
