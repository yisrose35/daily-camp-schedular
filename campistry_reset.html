<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Set a new password · Campistry</title>
<link rel="icon" type="image/png" href="Campistry_logo.png">

<!--
  The landing page for a password-reset email, shared by Campistry Lite and
  Campistry Link.

  Why a separate page rather than handling it inside each app: the reset link is
  opened from an email, which means a BROWSER, not the app. Inside a Capacitor
  shell `location.origin` is capacitor://localhost or https://localhost, so a
  redirect built from it is dead on arrival — which is exactly what Lite's old
  "forgot password" did. And Lite has no public web page at all: campistry.org
  404s its files and link.campistry.org redirects every .html except the parent
  portal. So neither app had anywhere for the link to land.

  This page is that place. It is deliberately tiny and self-contained: Supabase
  parses the recovery token out of the URL fragment, the parent or counselor
  picks a new password, and then they go back to the app and sign in. No session
  is carried anywhere and nothing else about either app is exposed here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --brand: #15803D; --brand-deep: #0F4A28; --brand-light: #18A94D; }
    /* ?app=lite paints the coral shell instead, so the page a counselor lands
       on looks like the app they asked to reset. */
    html[data-app="lite"] { --brand: #D9553F; --brand-deep: #B23A28; --brand-light: #EE6A53; }

    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100dvh;
        font-family: Roboto, system-ui, -apple-system, sans-serif;
        color: #fff;
        background:
            radial-gradient(120% 62% at 50% 6%, rgba(255,255,255,0.13), rgba(255,255,255,0) 60%),
            linear-gradient(163deg, var(--brand-light) 0%, var(--brand) 46%, var(--brand-deep) 100%);
        background-attachment: fixed;
        display: flex; align-items: flex-start; justify-content: center;
        padding: calc(clamp(44px, 11vh, 104px) + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    }
    .wrap { width: 100%; max-width: 348px; text-align: center; }
    .badge {
        width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.13));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 28px rgba(6,46,24,0.28);
        display: flex; align-items: center; justify-content: center;
    }
    .mark {
        width: 42px; height: 42px; background: #fff;
        -webkit-mask: url('Campistry_logo.png') center / contain no-repeat;
        mask: url('Campistry_logo.png') center / contain no-repeat;
    }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
    .sub { font-size: 0.9rem; opacity: 0.82; margin: 8px 0 30px; line-height: 1.5; }
    label {
        display: block; text-align: left; font-size: 0.72rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.07em;
        color: rgba(255,255,255,0.78); margin: 0 0 8px 2px;
    }
    .field { margin-bottom: 16px; position: relative; }
    input {
        width: 100%; height: 54px; padding: 0 50px 0 16px;
        font-family: inherit; font-size: 16px; font-weight: 500; color: #fff; caret-color: #fff;
        background: rgba(255,255,255,0.13);
        border: 1px solid rgba(255,255,255,0.22); border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
        transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    input:focus {
        outline: none; background: rgba(255,255,255,0.19);
        border-color: rgba(255,255,255,0.72);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 0 4px rgba(255,255,255,0.14);
    }
    .eye {
        position: absolute; top: 34px; right: 6px; width: 40px; height: 40px;
        border: none; border-radius: 10px; background: none; cursor: pointer;
        color: rgba(255,255,255,0.75); display: flex; align-items: center; justify-content: center;
    }
    .eye svg { width: 19px; height: 19px; }
    button.go {
        width: 100%; height: 54px; margin-top: 12px; border: none; border-radius: 14px;
        background: #fff; color: var(--brand-deep); cursor: pointer;
        font-family: inherit; font-size: 1rem; font-weight: 700;
        box-shadow: 0 8px 22px rgba(6,46,24,0.30);
        transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }
    button.go:active { transform: translateY(1px); background: rgba(255,255,255,0.9); }
    button.go:disabled { opacity: 0.6; cursor: default; transform: none; }
    .msg { min-height: 20px; margin-top: 14px; font-size: 0.84rem; font-weight: 600; }
    .msg.err { color: #FFD9DC; }
    .msg.ok  { color: #fff; }
    .foot { margin: 34px 0 0; font-size: 0.75rem; line-height: 1.6; color: rgba(255,255,255,0.62); }
</style>
</head>
<body>

<div class="wrap">
    <div class="badge"><span class="mark" role="img" aria-label="Campistry"></span></div>
    <h1 id="title">Set a new password</h1>
    <p class="sub" id="sub">Choose a new password for your Campistry account.</p>

    <form id="form" style="display:none;">
        <div class="field">
            <label for="pw1">New password</label>
            <input type="password" id="pw1" autocomplete="new-password" placeholder="At least 6 characters">
            <button type="button" class="eye" id="eye1" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <div class="field">
            <label for="pw2">Confirm password</label>
            <input type="password" id="pw2" autocomplete="new-password">
        </div>
        <button class="go" type="submit" id="save">Save new password</button>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <p class="foot" id="foot"></p>
</div>

<script src="config.js?v=20260901-26"></script>
<script src="supabase-js@2.js?v=20260901-26"></script>
<script>
(function () {
    'use strict';
    var qs = new URLSearchParams(location.search);
    var app = (qs.get('app') || '').toLowerCase() === 'lite' ? 'lite' : 'link';
    document.documentElement.setAttribute('data-app', app);
    var APP_NAME = app === 'lite' ? 'Campistry Lite' : 'Campistry Link';
    document.getElementById('foot').textContent = 'Then return to ' + APP_NAME + ' and sign in with your new password.';

    var cfg = window.__CAMPISTRY_SUPABASE__ || {};
    var msg = document.getElementById('msg');
    function say(t, kind) { msg.textContent = t; msg.className = 'msg ' + (kind || ''); }

    if (typeof supabase === 'undefined' || !supabase.createClient || !cfg.url) {
        say('Could not load. Please reopen the link from your email.', 'err');
        return;
    }
    // detectSessionInUrl (on by default) consumes the recovery token in the URL
    // fragment and turns it into a short-lived session that may change the
    // password and nothing else.
    var db = supabase.createClient(cfg.url, cfg.anonKey);

    var form = document.getElementById('form');
    var ready = false;
    function unlock() {
        if (ready) return;
        ready = true;
        form.style.display = '';
        say('');
    }

    // The event fires once the token in the URL has been exchanged. Some
    // browsers deliver it before this listener attaches, so getSession() below
    // covers that race rather than leaving the form hidden forever.
    db.auth.onAuthStateChange(function (event) {
        if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') unlock();
    });

    setTimeout(function () {
        db.auth.getSession().then(function (r) {
            if (r && r.data && r.data.session) { unlock(); return; }
            if (ready) return;
            document.getElementById('title').textContent = 'Link expired';
            document.getElementById('sub').textContent =
                'This reset link has already been used or has expired. Ask for a new one from the sign-in screen.';
            say('');
        });
    }, 900);

    document.getElementById('eye1').addEventListener('click', function () {
        var el = document.getElementById('pw1');
        var show = el.type === 'password';
        el.type = show ? 'text' : 'password';
        this.setAttribute('aria-pressed', show ? 'true' : 'false');
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = document.getElementById('pw1').value || '';
        var b = document.getElementById('pw2').value || '';
        if (a.length < 6) { say('Use at least 6 characters.', 'err'); return; }
        if (a !== b) { say('Those two passwords do not match.', 'err'); return; }

        var btn = document.getElementById('save');
        btn.disabled = true; btn.textContent = 'Saving…';
        db.auth.updateUser({ password: a }).then(function (res) {
            btn.disabled = false; btn.textContent = 'Save new password';
            if (res.error) { say(res.error.message || 'Could not save. Try again.', 'err'); return; }
            form.style.display = 'none';
            document.getElementById('title').textContent = 'Password changed';
            document.getElementById('sub').textContent =
                'You can now sign in to ' + APP_NAME + ' with your new password.';
            say('', 'ok');
            // Do not leave a usable session sitting in this browser tab.
            db.auth.signOut().catch(function () {});
        }).catch(function () {
            btn.disabled = false; btn.textContent = 'Save new password';
            say('Could not save — check your connection.', 'err');
        });
    });
})();
</script>
</body>
</html>
