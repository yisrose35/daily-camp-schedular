<!DOCTYPE html>
<html lang="en" data-product="lite">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in · Campistry Lite</title>
    <link rel="icon" type="image/png" href="Campistry_logo.png">

    <link rel="manifest" href="manifest_lite.webmanifest">
    <meta name="theme-color" content="#EE6A53">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Campistry">
    <link rel="apple-touch-icon" href="Campistry_logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

    <!-- Resolve the theme before first paint so the app never flashes the wrong
         one. Mirrors colorSchemePref() in campistry_lite.js. -->
    <script>(function(){try{var p=JSON.parse(localStorage.getItem('campistry_lite_prefs')||'{}');var c=p.colorScheme||'auto';var r=document.documentElement;if(c!=='auto')r.setAttribute('data-theme',c);r.style.colorScheme=c==='auto'?'light dark':c;}catch(e){}})();</script>
    <style>html:not(.css-ready) body { opacity: 0; } html.css-ready body { transition: opacity 0.15s ease; }</style>
    <link rel="stylesheet" href="campistry-unified.css">
    <link rel="stylesheet" href="campistry_lite.css" onload="document.documentElement.classList.add('css-ready')">
    <noscript><style>html body { opacity: 1 !important; }</style></noscript>
</head>
<body class="lite-login-page">

<!-- Deliberately built on the same brand canvas as the biometric lock screen
     (.lite-lock): coral gradient, badged mark, display wordmark, one white
     primary action. The two are the app's only gates, so they should read as
     the same door. This screen does NOT follow the light/dark theme — the
     brand colour IS the surface here, exactly as on the lock screen. -->
<div class="lite-login" id="liteLogin" style="display:none;">
    <div class="lite-login-inner">

        <div class="lite-login-badge">
            <span class="lite-login-mark" role="img" aria-label="Campistry"></span>
        </div>

        <h1 class="lite-login-title" id="liteLoginTitle">Campistry <span>Lite</span></h1>
        <p class="lite-login-sub" id="liteLoginSub">Sign in to your camp</p>

        <!-- Biometric entry sits ABOVE the form, not on a screen of its own —
             cancelling the OS prompt should leave you looking at the sign-in
             form already, the way dismissing Face ID in any other app just
             leaves you on the screen underneath, not a second tap away from
             it. Sized and weighted as a small addition to this screen, not a
             second competing action — a scan-frame icon, not a full-width
             button matching "Sign in", is what makes it read as PART of
             signing in rather than an alternative to it. Hidden entirely
             when this device has no credential enrolled, in which case the
             form below is all there ever is. -->
        <div id="liteBioQuick" class="lite-bio-quick" hidden>
            <!-- Fingerprint, not a face outline: WebAuthn never tells the app
                 which sensor the platform authenticator will actually use, so
                 showing a face glyph on a fingerprint-only phone would just be
                 wrong. Fingerprint is the one symbol that reads as "biometric"
                 regardless of which one the device ends up asking for. -->
            <button type="button" class="lite-bio-quick-btn" id="liteBioGo" aria-label="Sign in with biometrics">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <path d="M11.8 14.8C10.6 13.6 10.7 11.7 12.2 10.8C13.5 10 15 10.6 15.4 12"/>
                    <path d="M10.3 16.6C8.2 14.5 8.3 10.9 11 9C13.5 7.3 16.8 8.2 17.6 10.8"/>
                    <path d="M8.8 18.4C5.9 15.3 6 10 9.8 7.4C13.5 4.9 18.6 6.1 19.8 9.9"/>
                    <path d="M7.3 20.1C3.8 16.2 3.9 9.5 8.5 6.2C13.2 3.1 19.8 4.5 21.3 9.1"/>
                    <path d="M5.8 21.6C1.6 17 1.7 8.8 7.3 4.9C13.1 1 20.8 2.6 22.6 8.3"/>
                </svg>
            </button>
            <span class="lite-bio-quick-label" id="liteBioLabel">Sign in with biometrics</span>
        </div>

        <form id="liteLoginForm" novalidate autocomplete="on">
            <div class="lite-lf">
                <label for="liteEmail">Email address</label>
                <input class="lite-lf-input" type="email" id="liteEmail" inputmode="email"
                       autocomplete="username" autocapitalize="none" autocorrect="off"
                       spellcheck="false" required>
            </div>

            <div class="lite-lf">
                <label for="litePassword">Password</label>
                <div class="lite-lf-wrap">
                    <input class="lite-lf-input" type="password" id="litePassword"
                           autocomplete="current-password" required>
                    <button type="button" class="lite-lf-eye" id="litePwToggle" aria-label="Show password" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="lite-login-err" id="liteLoginErr" role="alert" hidden></div>

            <button class="lite-btn block lite-login-go" type="submit" id="liteLoginBtn">Sign in</button>
            <button type="button" class="lite-login-alt" id="liteForgot">Forgot your password?</button>
        </form>

        <!-- Offered once, straight after a successful password sign-in, while
             the benefit is obvious. Asking before anyone has signed in would be
             meaningless; burying it in Settings means nobody finds it. -->
        <div id="liteBioOffer" hidden>
            <p class="lite-login-offer">Skip the password next time — unlock Campistry Lite using <span id="liteBioKind">biometrics</span>.</p>
            <button type="button" class="lite-btn block lite-login-go" id="liteBioEnable">Turn it on</button>
            <button type="button" class="lite-login-alt" id="liteBioSkip">Not now</button>
        </div>

        <p class="lite-login-foot">
            Accounts are created by your camp on <a href="index.html">campistry.org</a>
        </p>
    </div>
</div>

<div id="liteToast" class="lite-toast" style="display:none;"></div>

<script src="config.js"></script>
<script src="supabase-js@2.js"></script>
<script src="supabase_client.js"></script>
<script src="campistry_lite_biometric.js"></script>
<script src="campistry_bio_native.js"></script>
<script src="campistry_haptics.js"></script>
<script src="campistry_keyboard.js"></script>
<script src="campistry_lite_capacitor.js"></script>
<script src="campistry_lite_login.js"></script>
<!-- LAST, and load-bearing. This page IS index.html — the app's entry point —
     so it is where a live update has to confirm it booted. Without it the
     updater saw every launch that stopped at sign-in as a failed bundle and
     rolled the app back to the version built into the APK. -->
<script src="campistry_ota.js"></script>
</body>
</html>
