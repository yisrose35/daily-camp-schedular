<!DOCTYPE html>
<html lang="en" data-product="snacks">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campistry Snacks — Register Login</title>
<link rel="icon" type="image/png" href="Campistry_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
    --slate-25:#FCFCFD;--slate-50:#F8FAFC;--slate-100:#F1F5F9;--slate-200:#E2E8F0;
    --slate-300:#CBD5E1;--slate-400:#94A3B8;--slate-500:#64748B;--slate-600:#475569;
    --slate-700:#334155;--slate-800:#1E293B;--slate-900:#0F172A;
    --teal-500:#147D91;--teal-600:#0F5F6E;--teal-700:#0A4A56;
    --red-500:#EF4444;--red-50:#FEF2F2;--red-600:#DC2626;
    --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--slate-900),var(--slate-800));
    font-family:var(--font-body);color:var(--slate-900);padding:24px;
}
.card{
    width:100%;max-width:380px;background:#fff;border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);padding:34px 30px 30px;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.brand img{height:40px;width:auto}
.brand-title{font-size:1.05rem;font-weight:700;color:var(--slate-900)}
.brand-sub{font-size:.82rem;color:var(--slate-500);text-align:center}
label{display:block;font-size:.78rem;font-weight:600;color:var(--slate-600);margin-bottom:8px;text-align:center;letter-spacing:.02em;text-transform:uppercase}
#pinInput{
    width:100%;font-size:2.1rem;letter-spacing:.5rem;text-align:center;
    padding:16px 10px;border:2px solid var(--slate-200);border-radius:14px;
    font-weight:700;color:var(--slate-900);background:var(--slate-50);
    font-variant-numeric:tabular-nums;
}
#pinInput:focus{outline:none;border-color:var(--teal-500);background:#fff}
.err{
    display:none;margin-top:14px;padding:10px 12px;border-radius:10px;
    background:var(--red-50);color:var(--red-600);font-size:.85rem;line-height:1.4;text-align:center;
}
.err.show{display:block}
button{
    width:100%;margin-top:18px;padding:14px;border:none;border-radius:12px;
    background:var(--teal-600);color:#fff;font-size:1rem;font-weight:700;
    font-family:inherit;cursor:pointer;transition:background .15s;
}
button:hover:not(:disabled){background:var(--teal-700)}
button:disabled{opacity:.55;cursor:default}
.foot{margin-top:18px;text-align:center;font-size:.75rem;color:var(--slate-400)}
.setup{
    display:none;text-align:center;color:var(--slate-500);font-size:.88rem;line-height:1.6;
}
.setup.show{display:block}
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="Campistry_logo.png" alt="Campistry">
        <div class="brand-title">Snacks — Register Login</div>
        <div class="brand-sub" id="campHint">Enter the register PIN to open the selling console.</div>
    </div>

    <div id="loginForm">
        <label for="pinInput">Register PIN</label>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinInput" autocomplete="off" autofocus>
        <div class="err" id="errBox"></div>
        <button id="submitBtn" onclick="submitPin()">Unlock Register</button>
    </div>

    <div class="setup" id="noCampBox">
        This login link is missing its camp. Ask the office to re-share the
        register link from the Manager Dashboard's Settings page.
    </div>

    <div class="foot">Only for staff running the canteen register.</div>
</div>

<script src="config.js?v=20260901-13"></script>
<script src="supabase-js@2.js?v=20260901-13"></script>
<script>
(function(){
    'use strict';

    function getCampId(){
        var m = /[?&]camp=([^&]+)/.exec(window.location.search);
        if (m) return decodeURIComponent(m[1]);
        try { return localStorage.getItem('campistry_pos_last_camp') || ''; } catch(e){ return ''; }
    }

    var campId = getCampId();
    var cfg = window.__CAMPISTRY_SUPABASE__;
    var client = (cfg && window.supabase && window.supabase.createClient)
        ? window.supabase.createClient(cfg.url, cfg.anonKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
        })
        : null;

    if (!campId || !client) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('noCampBox').classList.add('show');
    }

    var pinInput = document.getElementById('pinInput');
    var errBox = document.getElementById('errBox');
    var submitBtn = document.getElementById('submitBtn');

    function showErr(msg){
        errBox.textContent = msg;
        errBox.classList.add('show');
    }
    function clearErr(){
        errBox.classList.remove('show');
        errBox.textContent = '';
    }

    pinInput && pinInput.addEventListener('input', function(){
        this.value = this.value.replace(/[^0-9]/g, '');
        clearErr();
    });
    pinInput && pinInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter') submitPin();
    });

    window.submitPin = function(){
        if (!client || !campId) return;
        var pin = (pinInput.value || '').trim();
        if (!pin) { showErr('Enter the PIN.'); return; }
        clearErr();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking…';

        client.functions.invoke('pos-pin-login', { body: { campId: campId, pin: pin } })
            .then(function(res){
                return _unwrap(res);
            })
            .then(function(data){
                if (!data || !data.access_token) {
                    throw new Error((data && data.error) || 'Could not log in.');
                }
                return client.auth.setSession({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token
                }).then(function(){
                    try { localStorage.setItem('campistry_pos_last_camp', campId); } catch(e){}
                    window.location.href = '/pos';
                });
            })
            .catch(function(e){
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unlock Register';
                pinInput.value = '';
                pinInput.focus();
                showErr((e && e.message) || 'Could not log in. Try again.');
            });
    };

    // supabase-js's functions.invoke() collapses every non-2xx response into
    // a generic error — the real { error: "..." } body this function returns
    // lives on res.error.context instead. Same unwrap pattern already used
    // elsewhere in this app (campistry_snacks.js's _edgeFnErrorMessage).
    function _unwrap(res){
        var data = res && res.data;
        if (data && (data.access_token || data.error)) return data;
        var err = res && res.error;
        if (err && err.context && typeof err.context.json === 'function') {
            return err.context.json().catch(function(){ return { error: (err && err.message) || 'Could not log in.' }; });
        }
        return { error: (err && err.message) || 'Could not log in.' };
    }
})();
</script>
</body>
</html>
