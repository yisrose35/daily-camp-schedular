    <!-- Loading overlay — inline styles so it appears instantly with zero
         FOUC, before any external CSS loads. Hidden by campistry_me.js
         only after cloud hydration completes and the UI has populated. -->
    <style>
        .me-loading-overlay {
            position: fixed; inset: 0; z-index: 999999;
            background: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.4s ease;
        }
        .me-loading-overlay.hide { opacity: 0; pointer-events: none; }
        .me-loading-logo {
            width: 220px; height: 220px;
            object-fit: contain;
            opacity: 0.15;
        }
    </style>
</head>
<body>
<div id="meLoadingOverlay" class="me-loading-overlay" role="status" aria-live="polite">
    <img src="Me_clean.png" alt="" class="me-loading-logo" id="me-logo-draw">
    <script>
    (function() {
        var img = document.getElementById('me-logo-draw');
        if (!img) return;
        window._meAnimStart = Date.now();
        var steps = 60;
        var totalMs = 2000;
        var stepMs = totalMs / steps;
        var i = 0;
        function tick() {
            i++;
            var pct = Math.min(i / steps, 1);
            var ease = pct < 0.5 ? 2 * pct * pct : 1 - Math.pow(-2 * pct + 2, 2) / 2;
            img.style.opacity = 0.15 + ease * 0.85;
            if (i < steps) setTimeout(tick, stepMs);
        }
        tick();
    })();
    </script>
</div>
