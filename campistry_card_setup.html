<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save a Payment Method — Campistry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Campistry_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'DM Sans',system-ui,sans-serif;background:linear-gradient(180deg,#F1F5F9 0%,#F8FAFC 220px);color:#1E293B;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
        .card{background:#fff;border:1px solid #E2E8F0;border-radius:20px;box-shadow:0 10px 34px rgba(15,23,42,.08);max-width:460px;width:100%;padding:32px 28px}
        h1{font-family:'Fraunces',serif;font-size:1.35rem;line-height:1.25;margin-bottom:8px;text-align:center}
        .sub{color:#64748B;font-size:.85rem;line-height:1.55;text-align:center;margin-bottom:8px}
        .amount{font-family:'Fraunces',serif;font-size:2rem;text-align:center;color:#0F172A;margin:2px 0 6px}

        /* Small uppercase divider that separates card details from billing */
        .sec{display:flex;align-items:center;gap:10px;font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#94A3B8;margin:22px 0 12px}
        .sec::after{content:"";flex:1;height:1px;background:#E2E8F0}

        .field-label{font-size:.76rem;font-weight:600;color:#475569;margin-bottom:6px;display:block}
        .field-group{margin-bottom:12px}
        .row{display:flex;gap:10px}
        .row .field-group{flex:1;min-width:0}
        .req{color:#DC2626}

        input.txt{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:11px 13px;background:#fff;font:inherit;font-size:.95rem;color:#1E293B;outline:none;transition:border-color .15s,box-shadow .15s}
        input.txt::placeholder{color:#94A3B8}
        input.txt:focus{border-color:#147D91;box-shadow:0 0 0 3px rgba(20,125,145,.13)}
        input.txt.bad{border-color:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.10)}

        /* Banquest's tokenizer mounts an iframe here holding its OWN card,
           expiry and CVV inputs. Those are styled from JS via the library's
           styles option (it writes inline style attributes on the elements
           inside the frame) — our stylesheet cannot reach across the frame
           boundary. No border or fixed height here: the library sizes the frame
           to its content, and a fixed height would clip it or leave dead space. */
        #bq-card iframe{width:100%;border:none;display:block}

        button#saveBtn{width:100%;background:#147D91;color:#fff;border:none;border-radius:11px;padding:14px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;margin-top:18px;transition:background .15s,transform .05s}
        button#saveBtn:hover:not(:disabled){background:#10697A}
        button#saveBtn:active:not(:disabled){transform:translateY(1px)}
        button#saveBtn:disabled{opacity:.6;cursor:default}

        .msg{font-size:.85rem;text-align:center;margin-top:12px;min-height:1.2em;line-height:1.45}
        .msg.err{color:#DC2626}
        .msg.ok{color:#0E7C4A}

        .trust{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;font-size:.73rem;color:#94A3B8;line-height:1.4;text-align:center}
        .trust svg{flex:none}

        .icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:#ECFDF5;color:#0E7C4A}
        .note{margin-top:18px;font-size:.75rem;color:#94A3B8;text-align:center}

        @media (max-width:420px){
            .card{padding:26px 20px}
            .row{flex-wrap:wrap}
            .row .field-group{flex:1 1 100%}
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <h1>Loading…</h1>
    </div>

    <!-- pay-now note: an amount/description in the URL flips this page from
         "save a card for later" into "pay this specific balance now" — the
         BYOP equivalent of a Stripe Checkout payment link (sendPayLink() in
         campistry_me.js sends a BYOP camp's family here instead of a Stripe
         URL). Same tokenizer, same PCI-scope-reduction role; the only
         difference is which edge function the resulting token is posted to
         and what the button/copy say. -->

    <!-- Same 3-script cloud config pattern every other public Campistry page
         uses (campistry_register.html, etc.) — config.js injects
         window.__CAMPISTRY_SUPABASE__, supabase_client.js builds the client
         from it. -->
    <!-- This page is public and only calls anon RPCs — no camp/role detection
         needed. Without this flag, a signed-in visitor who doesn't own THIS
         camp sets off the owner-camp lookup, which fails and logs an alarming
         "this is a bug" error on every auth state change. -->
    <script>
    window.__CAMPISTRY_PUBLIC_PAGE__ = true;
    // Bump on every change to this page. Printed on load so a stale cached copy
    // is obvious at a glance instead of being mistaken for a code bug.
    window.__CARD_PAGE_BUILD__ = '2026-09-15-04';
    console.log('[Campistry] card page build', window.__CARD_PAGE_BUILD__);
    </script>
    <script src="config.js"></script>
    <script src="supabase-js@2.js"></script>
    <script src="supabase_client.js"></script>

    <script>
    (function() {
        var params = new URLSearchParams(location.search);
        var campId = params.get('campId');
        var familyKey = params.get('familyKey');
        var familyName = params.get('familyName') || 'your family';
        // camperName (no familyKey) is canteen mode — a parent's own "Add
        // Funds" tap (addFunds() in campistry_link_parent.html) for a camp
        // on a connected BYOP processor, always pay-now (no "save a canteen
        // card for later" concept). familyKey is tuition mode — either
        // "save a card" (office-initiated) or, with `amount`, a one-time pay
        // link (sendPayLink() in campistry_me.js).
        var camperName = params.get('camperName') || '';
        var isCanteen = !!camperName && !familyKey;
        // mode=save forces "save a card for later" even in camper (canteen)
        // mode, which is how canteen AUTO-RELOAD saves a camper's card: there's
        // no amount to charge, the token just has to land on that camper's
        // autoReload block so the reload cron can charge it later.
        var saveMode = params.get('mode') === 'save';
        // Presence of `amount` is what flips tuition mode from "save a card
        // for later" into "pay this specific balance now" — the BYOP
        // equivalent of a Stripe Checkout payment link. `amount` is
        // display-only here; the edge function it's posted to never trusts
        // a client-supplied amount for anything security-relevant beyond
        // "how much to charge this specific token."
        var amount = parseFloat(params.get('amount') || '');
        var isPayNow = !saveMode && (isCanteen || amount > 0);
        var payDesc = params.get('desc') || (isCanteen ? ('Canteen funds — ' + camperName) : ('Camp payment — ' + familyName));
        var returnUrl = params.get('return') || '';
        var cardEl = document.getElementById('card');
        if (isPayNow) document.title = 'Make a Payment — Campistry';

        function getClient() {
            return (window.CampistryDB && window.CampistryDB.getClient && window.CampistryDB.getClient()) ||
                   (window.supabase && typeof window.supabase.rpc === 'function' ? window.supabase : null);
        }

        function renderError(msg) {
            cardEl.innerHTML = '<h1>Something went wrong</h1><p class="sub">' + msg + '</p>' +
                '<div class="note">Contact your camp\'s office if this keeps happening.</div>';
        }

        function renderSuccess(paidAmount) {
            var closeNote = returnUrl ? 'Taking you back to your camp portal…' : 'You can close this window.';
            var msg = isCanteen
                ? 'Your payment of $' + Number(paidAmount || amount).toFixed(2) + ' was added to ' + escapeHtml(camperName) + '\'s canteen balance. ' + closeNote
                : isPayNow
                ? 'Your payment of $' + Number(paidAmount || amount).toFixed(2) + ' for ' + escapeHtml(familyName) + ' was received. ' + closeNote
                : ('A payment method is now on file for ' + escapeHtml(isCanteen ? camperName : familyName) + '. ' + closeNote);
            cardEl.innerHTML =
                '<div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>' +
                '<h1 style="text-align:center">' + (isPayNow ? 'Payment received!' : 'Saved!') + '</h1>' +
                '<p class="sub">' + msg + '</p>';
            // Only meaningful when the parent tapped Add Funds from inside
            // Link (addFunds() passes &return=...) — an office-generated pay
            // link (sendPayLink()) has nothing to return to, so it never
            // carries this param and the page just shows the static message.
            if (returnUrl) setTimeout(function() { window.location.href = returnUrl; }, 1500);
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[<>&"]/g, function(c) {
                return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
            });
        }

        if (!campId || !(familyKey || camperName)) {
            renderError('This link is missing information and can\'t be used.');
            return;
        }

        var client = getClient();
        if (!client) {
            renderError('Could not reach Campistry\'s servers. Check your connection and reload.');
            return;
        }

        client.rpc('get_camp_public_tokenization_key', { p_camp_id: campId }).then(function(res) {
            var data = res.data;
            if (res.error || !data || !data.success) {
                renderError('This camp hasn\'t finished setting up online payments yet.');
                return;
            }
            // Banquest ONLY, deliberately. Sola/Cardknox camps collect cards on
            // Sola's OWN hosted page (cardknox-checkout-start mints the link) —
            // one card-entry experience per processor, and Sola's is theirs, so
            // this page never renders a Sola form. Nothing routes a Sola camp
            // here; this branch only catches a hand-edited/stale URL.
            if (data.processorKey === 'banquest') {
                renderBanquestForm(data.tokenizationKey, data.tokenizationUrl, data.cardFormFields);
            } else {
                renderError('This camp collects cards on its payment processor\'s own secure page, not here. Please start from your camp portal, or contact the office.');
            }
        }).catch(function() {
            renderError('Could not reach Campistry\'s servers. Check your connection and reload.');
        });

        // ─── Admin-configured billing fields ────────────────────────────────
        // Which of these the parent sees is the camp's call
        // (campistryMe.cardFormFields, edited in the dashboard Payment tab and
        // returned by get_camp_public_tokenization_key — migration 150).
        // They're not cosmetic: Banquest runs AVS on billing street + ZIP, and
        // populating them is what earns the better e-commerce rate, so the
        // collected values are sent on as billing_info.
        // Order here is the order they render in.
        var BILLING_FIELDS = [
            { key: 'name',    label: 'Cardholder name', autocomplete: 'cc-name',            type: 'text'  },
            { key: 'email',   label: 'Email',           autocomplete: 'email',              type: 'email' },
            { key: 'phone',   label: 'Phone',           autocomplete: 'tel',                type: 'tel'   },
            { key: 'street',  label: 'Billing address', autocomplete: 'billing address-line1', type: 'text' },
            { key: 'street2', label: 'Apt / Suite',     autocomplete: 'billing address-line2', type: 'text' },
            { key: 'city',    label: 'City',            autocomplete: 'billing address-level2', type: 'text', group: 'cityState' },
            { key: 'state',   label: 'State',           autocomplete: 'billing address-level1', type: 'text', group: 'cityState' },
            { key: 'zip',     label: 'ZIP code',        autocomplete: 'billing postal-code',    type: 'text', group: 'cityState' },
            { key: 'country', label: 'Country',         autocomplete: 'billing country-name',   type: 'text' }
        ];

        // Fields the camp actually turned on, in render order.
        function activeBillingFields(config) {
            var cfg = (config && typeof config === 'object') ? config : {};
            return BILLING_FIELDS.filter(function(f) {
                var c = cfg[f.key];
                return !!(c && c.enabled);
            }).map(function(f) {
                var c = cfg[f.key] || {};
                // Copy so `required` never mutates the shared descriptor.
                return {
                    key: f.key, label: f.label, autocomplete: f.autocomplete,
                    type: f.type, group: f.group, required: !!c.required
                };
            });
        }

        function billingFieldsHtml(fields) {
            var html = '';
            var i = 0;
            while (i < fields.length) {
                var f = fields[i];
                // City/State/ZIP sit on one row when more than one is enabled,
                // so a full address doesn't turn into a tall column of boxes.
                if (f.group === 'cityState') {
                    var run = [];
                    while (i < fields.length && fields[i].group === 'cityState') { run.push(fields[i]); i++; }
                    html += run.length > 1
                        ? '<div class="row">' + run.map(oneBillingField).join('') + '</div>'
                        : oneBillingField(run[0]);
                    continue;
                }
                html += oneBillingField(f);
                i++;
            }
            return html;
        }

        function oneBillingField(f) {
            return '<div class="field-group">' +
                '<span class="field-label">' + escapeHtml(f.label) +
                    (f.required ? ' <span class="req">*</span>' : '') + '</span>' +
                '<input class="txt" type="' + f.type + '" id="bf-' + f.key + '"' +
                    ' autocomplete="' + f.autocomplete + '"' +
                    ' data-bf="' + f.key + '"' + (f.required ? ' data-req="1"' : '') + '>' +
                '</div>';
        }

        // Returns the billing object, or null when a required field is empty
        // (and marks the offenders red). Empty optional fields are omitted
        // entirely rather than sent as "" — the gateway treats a blank AVS
        // field worse than an absent one.
        function collectBilling(fields) {
            var out = {};
            var missing = null;
            fields.forEach(function(f) {
                var el = document.getElementById('bf-' + f.key);
                var val = el ? String(el.value || '').trim() : '';
                if (el) el.classList.remove('bad');
                if (!val) {
                    if (f.required) {
                        if (el) el.classList.add('bad');
                        if (!missing) missing = f.label;
                    }
                    return;
                }
                out[f.key] = val;
            });
            if (missing) {
                setMsg('Please fill in ' + missing + '.', true);
                return null;
            }
            return out;
        }

        // ─── Banquest Hosted Tokenization (AffiniPay/8am) ────────────────────
        // *** Written from Banquest's tokenization/v0.3 docs; verify the
        // getNonceToken() result shape against a live sandbox. *** The script
        // URL and the pk_ tokenization key both come from
        // get_camp_public_tokenization_key (per-camp, sandbox vs prod). The
        // tokenizer renders its own card iframe into #bq-card; getNonceToken()
        // returns a nonce we send to payments-save-method (or the pay-now
        // path), where the server prefixes it as source "nonce-<nonce>".
        function renderBanquestForm(tokenizationKey, tokenizationUrl, cardFormFields) {
            // Pay-now leads with the amount (it's the one number that matters);
            // save-mode leads with who the card is for.
            var title = isPayNow ? (isCanteen ? 'Add canteen funds' : 'Make a payment') : 'Save a payment method';
            var whoFor = isCanteen ? escapeHtml(camperName) + '\'s canteen account' : escapeHtml(familyName);
            var sub = isPayNow
                ? ('For ' + whoFor + ' — ' + escapeHtml(payDesc))
                : ('For ' + whoFor + ' — ' + (isCanteen ? 'used to top up the balance automatically.' : 'used for future camp charges.'));
            var btnLabel = isPayNow ? ('Pay $' + amount.toFixed(2)) : 'Save Payment Method';
            var fields = activeBillingFields(cardFormFields);
            var lock = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
                '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
            cardEl.innerHTML =
                '<h1>' + title + '</h1>' +
                (isPayNow ? '<div class="amount">$' + amount.toFixed(2) + '</div>' : '') +
                '<p class="sub">' + sub + '</p>' +
                '<div class="sec">Card details</div>' +
                '<div class="field-group"><div id="bq-card"></div></div>' +
                (fields.length ? '<div class="sec">Billing details</div>' : '') +
                billingFieldsHtml(fields) +
                '<button id="saveBtn" type="button">' + btnLabel + '</button>' +
                '<div class="msg" id="msg"></div>' +
                '<div class="trust">' + lock + '<span>Your card is entered directly with the payment processor. Campistry never sees or stores your card number.</span></div>';

            if (!tokenizationUrl) {
                setMsg('This camp\'s payment form isn\'t configured yet — please contact the office.', true);
                return;
            }

            var script = document.createElement('script');
            script.src = tokenizationUrl;
            script.onload = function() {
                if (typeof window.HostedTokenization === 'undefined') {
                    setMsg('Could not load the payment form. Reload and try again.', true);
                    return;
                }
                var ht;
                try {
                    // v0.3: the card/expiry/CVV iframe is created and mounted by
                    // the constructor via `target` — there is no separate
                    // create()/mount() step (that was v0.2). showZip stays false
                    // because we collect ZIP ourselves when the camp asks for it,
                    // and send it on as avs_zip; enabling it here would render a
                    // second ZIP box inside the iframe.
                    // Styles are written as inline style attributes on the
                    // elements INSIDE the iframe, so this is the only way to make
                    // the card fields match the rest of the form. Fonts must be a
                    // real stack, not `inherit` — the iframe is a separate
                    // document and never loads our webfont.
                    var bqInput = 'width:100%;box-sizing:border-box;border:1px solid #CBD5E1;' +
                        'border-radius:10px;padding:11px 13px;background:#fff;color:#1E293B;' +
                        'font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;' +
                        'font-size:15px;line-height:1.25;outline:none;';
                    ht = new window.HostedTokenization(tokenizationKey, {
                        target: '#bq-card',
                        showZip: false,
                        requireCvv2: true,
                        showFieldErrors: true,
                        styles: {
                            // Card number on its own row, expiry + CVV sharing
                            // the next one.
                            container: 'display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;border:none;',
                            cardContainer: 'flex:1 1 100%;min-width:0;',
                            card: bqInput,
                            expiryContainer: 'flex:1 1 150px;min-width:0;display:flex;align-items:center;gap:6px;',
                            expiryMonth: bqInput,
                            expirySeparator: 'color:#94A3B8;padding:0 2px;font-family:system-ui,sans-serif;',
                            expiryYear: bqInput,
                            cvv2Container: 'flex:1 1 110px;min-width:0;',
                            cvv2: bqInput,
                            fieldErrors: 'color:#DC2626;font-size:12px;margin-top:4px;',
                            labelType: 'hidden'
                        }
                    });
                } catch (e) {
                    setMsg('Could not load the payment form. Reload and try again.', true);
                    return;
                }
                document.getElementById('saveBtn').addEventListener('click', function() {
                    setMsg('');
                    // Validate our own fields BEFORE asking the tokenizer for a
                    // nonce — a nonce is single-use, so burning one on a form
                    // the parent has to fix would force them to re-enter the card.
                    var billing = collectBilling(fields);
                    if (!billing) return;
                    setSaving(true);
                    var p;
                    try { p = ht.getNonceToken(); } catch (e) {
                        setMsg('Could not process the card — check the details and try again.', true);
                        setSaving(false);
                        return;
                    }
                    if (!p || typeof p.then !== 'function') {
                        setMsg('Could not process the card. Reload and try again.', true);
                        setSaving(false);
                        return;
                    }
                    p.then(function(result) {
                        // CardFormResult: { nonce, last4, cardType, expiryMonth,
                        // expiryYear, avsZip, maskedCard, maskedCvv2 }. The nonce
                        // expires 15 minutes after it's issued.
                        var nonce = result && result.nonce;
                        if (!nonce || typeof nonce !== 'string') {
                            setMsg('Could not read the card — check the details and try again.', true);
                            setSaving(false);
                            return;
                        }
                        submitToken(nonce, billing, result);
                    }).catch(function(err) {
                        // A validation rejection carries fieldErrors naming the
                        // bad card fields — much more useful than a generic retry.
                        var fe = err && err.fieldErrors;
                        var labels = { card: 'card number', expiryMonth: 'expiry month', expiryYear: 'expiry year', cvv2: 'CVV', avsZip: 'ZIP' };
                        setMsg(
                            (fe && fe.length)
                                ? ('Please check the ' + fe.map(function(k) { return labels[k] || k; }).join(', ') + '.')
                                : ((err && err.message) || 'Could not process the card — check the details and try again.'),
                            true);
                        setSaving(false);
                    });
                });
            };
            script.onerror = function() {
                setMsg('Could not load the payment form. Reload and try again.', true);
            };
            document.head.appendChild(script);
        }

        function setSaving(saving) {
            var btn = document.getElementById('saveBtn');
            if (!btn) return;
            var idleLabel = isPayNow ? ('Pay $' + amount.toFixed(2)) : 'Save Payment Method';
            btn.disabled = saving;
            btn.textContent = saving ? (isPayNow ? 'Processing…' : 'Saving…') : idleLabel;
        }

        function setMsg(text, isErr) {
            var el = document.getElementById('msg');
            if (!el) return;
            el.textContent = text;
            el.className = 'msg' + (text ? (isErr ? ' err' : ' ok') : '');
        }

        // Pay-now mode charges the card immediately via payments-charge-nonce
        // (one self-contained function for both tuition and canteen — it
        // replaces payments-checkout/payments-canteen-checkout, which import
        // ../_shared and therefore can't bundle on a Dashboard deploy).
        // Save-for-later mode only tokenizes+saves (payments-save-method).
        // `billing` carries whatever the camp configured us to collect; the
        // server forwards it as Banquest billing_info so AVS runs.
        function submitToken(token, billing, cardResult) {
            var fnName = isPayNow ? 'payments-charge-nonce' : 'payments-save-method';
            // Banquest's own integration example sends expiry_month/expiry_year/
            // avs_zip alongside the nonce, so pass them through. avsZip only
            // comes back when the iframe collected it (showZip) — otherwise use
            // the ZIP from our own form.
            // Banquest REQUIRES expiry_month/expiry_year alongside the nonce, so
            // this has to survive naming differences between the documented
            // CardFormResult and what the library actually resolves with.
            function pick() {
                for (var i = 0; i < arguments.length; i++) {
                    var v = cardResult[arguments[i]];
                    if (v !== undefined && v !== null && v !== '') return v;
                }
                return undefined;
            }
            var card = cardResult ? {
                expiryMonth: pick('expiryMonth', 'expiry_month', 'month', 'expMonth'),
                expiryYear: pick('expiryYear', 'expiry_year', 'year', 'expYear'),
                avsZip: pick('avsZip', 'avs_zip', 'zip') || (billing && billing.zip) || '',
                last4: pick('last4', 'last_4'),
                cardType: pick('cardType', 'card_type')
            } : null;
            // Shape only — no nonce, no PAN. An expiry month/year on its own
            // identifies nothing, and without this there's no way to tell a
            // stale cached page from a result whose keys we guessed wrong.
            try {
                console.log('[Campistry] tokenizer result keys:', cardResult ? Object.keys(cardResult) : null,
                            '→ expiry:', card && card.expiryMonth, '/', card && card.expiryYear);
            } catch (e) { /* console unavailable */ }
            var body = isPayNow
                ? (isCanteen
                    ? { campId: campId, kind: 'canteen_deposit', camperName: camperName, token: token, amount: amount, description: payDesc, billing: billing, card: card }
                    : { campId: campId, kind: 'tuition_charge', familyKey: familyKey, familyName: familyName, token: token, amount: amount, description: payDesc, billing: billing, card: card })
                // Save mode: camperName saves onto that camper's canteen
                // auto-reload block, familyKey onto the family record.
                : (isCanteen
                    ? { campId: campId, camperName: camperName, token: token, billing: billing, card: card }
                    : { campId: campId, familyKey: familyKey, token: token, billing: billing, card: card });
            client.functions.invoke(fnName, { body: body }).then(function(res) {
                setSaving(false);
                var data = res.data;
                if (res.error || !data || !data.success) {
                    setMsg((data && data.error) || (isPayNow ? 'Could not process the payment. Try again.' : 'Could not save the payment method. Try again.'), true);
                    return;
                }
                renderSuccess(data.amount);
            }).catch(function() {
                setSaving(false);
                setMsg('Could not reach Campistry\'s servers. Try again.', true);
            });
        }
    })();
    </script>
</body>
</html>
