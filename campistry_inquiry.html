<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Request Information</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Campistry_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--me:#D97706;--me2:#B45309;--ok:#10B981;--err:#EF4444;--s50:#F8FAFC;--s100:#F1F5F9;--s200:#E2E8F0;--s300:#CBD5E1;--s400:#94A3B8;--s500:#64748B;--s600:#475569;--s700:#334155;--s800:#1E293B;--s900:#0F172A;--r:8px;--font:'DM Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--s50);color:var(--s800);-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:24px 20px 60px}
.hdr{text-align:center;margin-bottom:24px;padding:20px 0}
.hdr h1{font-size:1.5rem;font-weight:800;color:var(--s900)}
.hdr .cn{color:var(--me);font-size:1.2rem;font-weight:700}
.hdr p{font-size:.88rem;color:var(--s500);margin:4px 0 0}
.cd{background:#fff;border-radius:12px;border:1px solid var(--s200);padding:22px;margin-bottom:14px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:.78rem;font-weight:600;color:var(--s600);margin-bottom:3px}
.rq{color:var(--err);margin-left:2px}
.fi,.fta{width:100%;padding:10px 12px;border:1.5px solid var(--s200);border-radius:var(--r);font-size:.9rem;color:var(--s800);outline:none;font-family:var(--font);background:#fff}
.fi:focus,.fta:focus{border-color:var(--me);box-shadow:0 0 0 3px rgba(217,119,6,.08)}
.fta{resize:vertical;min-height:80px}
.fr{display:flex;gap:10px;flex-wrap:wrap}.fr>*{flex:1;min-width:130px}
.btn{width:100%;padding:14px;background:var(--me);color:#fff;border:none;border-radius:var(--r);font-size:1rem;font-weight:700;cursor:pointer;font-family:var(--font)}
.btn:hover{background:var(--me2)}
.err{display:none;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:10px 14px;border-radius:var(--r);font-size:.85rem;margin-bottom:14px}
.mut{font-size:.75rem;color:var(--s400);text-align:center;margin-top:10px}
.ok-wrap{display:none;text-align:center;background:#fff;border-radius:12px;border:1px solid var(--s200);padding:40px 24px}
.ok-wrap .ic{font-size:48px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><h1 id="campTitle">Request Information</h1><div class="cn" id="campNm"></div><p>Tell us a little about your camper and we'll be in touch.</p></div>

  <div id="formWrap">
    <div class="err" id="formErr"></div>
    <div class="cd">
      <div class="fg"><label class="fl">Your name<span class="rq">*</span></label><input class="fi" id="qN"></div>
      <div class="fr"><div class="fg"><label class="fl">Email<span class="rq">*</span></label><input class="fi" id="qE" type="email"></div><div class="fg"><label class="fl">Phone</label><input class="fi" id="qP" type="tel"></div></div>
      <div class="fr"><div class="fg"><label class="fl">Camper's name</label><input class="fi" id="qC"></div><div class="fg"><label class="fl">Grade or age</label><input class="fi" id="qG"></div></div>
      <div class="fg"><label class="fl">What are you interested in?</label><input class="fi" id="qI" placeholder="e.g. summer session, day camp, a specific program"></div>
      <div class="fg"><label class="fl">How did you hear about us?</label><input class="fi" id="qS"></div>
      <div class="fg"><label class="fl">Anything you'd like us to know?</label><textarea class="fta" id="qM" placeholder="Questions, what you're looking for…"></textarea></div>
    </div>
    <button class="btn" onclick="submitInquiry()">Send Inquiry</button>
    <p id="cloudNote" class="mut"></p>
  </div>

  <div class="ok-wrap" id="okWrap">
    <div class="ic">🎉</div>
    <h2 style="color:var(--ok)">Thanks — we got it!</h2>
    <p style="color:var(--s600);margin-top:8px" id="okMsg"></p>
  </div>
</div>

<script src="config.js?v=20260901-10" onerror="console.log('[Inquiry] config not loaded — local only')"></script>
<script src="supabase-js@2.js?v=20260901-10" onerror="console.log('[Inquiry] supabase-js not loaded')"></script>
<script src="supabase_client.js?v=20260901-10" onerror="console.log('[Inquiry] supabase_client not loaded')"></script>
<script>
(function(){
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function v(id){return(document.getElementById(id)?.value||'').trim();}
try{var g=JSON.parse(localStorage.getItem('campGlobalSettings_v1')||'{}');var cn=g.campName||g.camp_name||(g.campistryMe&&g.campistryMe.campName)||'';if(cn){document.getElementById('campTitle').textContent='Interested in '+cn+'?';document.getElementById('campNm').textContent=cn;}}catch(e){}
function showErr(m){var el=document.getElementById('formErr');el.textContent=m;el.style.display='block';el.scrollIntoView({behavior:'smooth',block:'center'});}

window.submitInquiry=function(){
    document.getElementById('formErr').style.display='none';
    var name=v('qN'),email=v('qE');
    if(!name)return showErr('Please enter your name.');
    if(!email)return showErr('Please enter your email so we can reach you.');
    var id='lead_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    var rec={parentName:name,email:email,phone:v('qP'),camperName:v('qC'),camperGrade:v('qG'),interests:v('qI'),source:v('qS')||'Website inquiry',message:v('qM'),status:'new',createdDate:new Date().toISOString().split('T')[0],createdAt:new Date().toISOString(),notes:'',activity:[]};
    try{
        var g=JSON.parse(localStorage.getItem('campGlobalSettings_v1')||'{}');
        if(!g.campistryMe)g.campistryMe={};
        if(!g.campistryMe.leads)g.campistryMe.leads={};
        g.campistryMe.leads[id]=rec;
        g.updated_at=new Date().toISOString();
        localStorage.setItem('campGlobalSettings_v1',JSON.stringify(g));
        _flushToCloud(g.campistryMe.leads).then(function(res){
            var el=document.getElementById('cloudNote');if(!el)return;
            if(res&&res.ok){el.textContent='✓ Sent to the camp';el.style.color='var(--ok)';}
            else{el.textContent='⚠ Saved on this device — reconnect to finish sending';el.style.color='var(--me)';}
        });
    }catch(e){console.error('[Inquiry] save error',e);return showErr('Something went wrong. Please try again.');}
    document.getElementById('formWrap').style.display='none';
    document.getElementById('okWrap').style.display='block';
    document.getElementById('okMsg').textContent='Thanks, '+name+'! We\'ve received your inquiry and someone from camp will reach out soon.';
    window.scrollTo(0,0);
};

async function _flushToCloud(leadsObj){
    try{
        var client=null,campId=null;
        for(var i=0;i<48;i++){
            client=(window.CampistryDB&&window.CampistryDB.getClient&&window.CampistryDB.getClient())||(window.supabase&&typeof window.supabase.from==='function'?window.supabase:null);
            campId=(window.CampistryDB&&window.CampistryDB.getCampId&&window.CampistryDB.getCampId())||localStorage.getItem('campistry_camp_id');
            if(client&&typeof client.from==='function'&&campId)break;
            await new Promise(function(r){setTimeout(r,250);});
        }
        if(!client||!campId)return{ok:false,reason:'no-client'};
        var cur=await client.from('camp_state_kv').select('value').eq('camp_id',campId).eq('key','campistryMe').maybeSingle();
        var cloudMe=(cur&&cur.data&&cur.data.value&&typeof cur.data.value==='object')?cur.data.value:{};
        var merged=Object.assign({},cloudMe);
        merged.leads=Object.assign({},cloudMe.leads||{},leadsObj||{});
        var up=await client.from('camp_state_kv').upsert({camp_id:campId,key:'campistryMe',value:merged,updated_at:new Date().toISOString()},{onConflict:'camp_id,key'});
        if(up&&up.error)return{ok:false,reason:up.error.message};
        return{ok:true};
    }catch(e){return{ok:false,reason:e&&e.message};}
}
})();
</script>
</body>
</html>
