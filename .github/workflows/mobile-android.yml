name: Mobile — Android build

# Builds installable Android APKs for the two Campistry mobile apps.
# Runs on Linux (no Android Studio, no local JDK/SDK needed), so a
# Windows-only workstation can still produce a build to sideload for testing.
#
# Download the APK from the run's "Artifacts" section, open it on an Android
# phone, and allow install-from-unknown-sources when prompted.
#
# Two modes, same shape as the iOS workflow:
#   * Debug (default) — assembleDebug, unsigned-for-Play-Store, sideload only.
#     No secrets needed.
#   * Release — set `release: true` on a manual dispatch. Signs a real
#     Play Store .aab with the permanent upload key. Requires these secrets
#     (Settings → Secrets → Actions), one set per app:
#       LITE_KEYSTORE_BASE64     base64 of the upload keystore file
#       LITE_KEYSTORE_PASSWORD   its store/key password (same value for both)
#       LITE_KEY_ALIAS           key alias inside the keystore (e.g. "upload")
#       LINK_KEYSTORE_BASE64 / LINK_KEYSTORE_PASSWORD / LINK_KEY_ALIAS  — same, for Link

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        required: true
        default: both
        type: choice
        options: [both, lite, link]
      release:
        description: Sign a real Play Store .aab with the upload key (requires the keystore secrets)
        required: false
        default: false
        type: boolean
  push:
    branches: [New-Features]
    paths:
      - 'mobile/**'
      - 'campistry_lite*.js'
      - 'campistry_lite*.html'
      - 'campistry_lite.css'
      - 'campistry_link*.js'
      - 'campistry_link*.html'
      - 'campistry_link.css'
      - 'campistry-unified.css'
      - 'config.js'
      - '.github/workflows/mobile-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [lite, link]
    steps:
      - name: Skip unselected app
        id: gate
        run: |
          want='${{ github.event_name == 'workflow_dispatch' && inputs.app || 'both' }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.app }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/campistry-${{ matrix.app }}/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.run == 'yes'

      # npm ci needs a lockfile; fall back to install so a freshly scaffolded
      # app builds before its lockfile is committed.
      - name: Install Capacitor
        if: steps.gate.outputs.run == 'yes'
        working-directory: mobile/campistry-${{ matrix.app }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # sync-www.js also verifies every referenced file made it into www/ —
      # a missing file is a white screen on device, so let it fail the build.
      - name: Sync web assets into the app bundle
        if: steps.gate.outputs.run == 'yes'
        working-directory: mobile/campistry-${{ matrix.app }}
        run: npm run sync

      - name: Assemble debug APK
        if: steps.gate.outputs.run == 'yes' && inputs.release != true
        working-directory: mobile/campistry-${{ matrix.app }}/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      # The commit sha is in the artifact name on purpose: `gh run list` right
      # after a push still returns the PREVIOUS run, so it is easy to download
      # a build that is one commit stale and not notice. With the sha here, the
      # artifact you fetched either matches the commit you meant or it doesn't.
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'yes' && inputs.release != true
        with:
          name: campistry-${{ matrix.app }}-debug-apk-${{ github.sha }}
          path: mobile/campistry-${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── Signed release .aab ───────────────────────────────────────────────
      # GitHub Actions can't interpolate a secret NAME from an expression
      # (${{ secrets[matrix.app] }} isn't allowed), so each app's three
      # secrets are selected in its own gated step and re-exported under one
      # fixed set of env var names — the same trick build.gradle's
      # signingConfigs.release block expects (ANDROID_KEYSTORE_PATH etc.).
      - name: Select keystore secrets (lite)
        if: steps.gate.outputs.run == 'yes' && inputs.release == true && matrix.app == 'lite'
        run: |
          echo "${{ secrets.LITE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.LITE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.LITE_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Select keystore secrets (link)
        if: steps.gate.outputs.run == 'yes' && inputs.release == true && matrix.app == 'link'
        run: |
          echo "${{ secrets.LINK_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.LINK_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.LINK_KEY_ALIAS }}" >> "$GITHUB_ENV"

      # Play Console rejects a re-upload whose versionCode isn't strictly
      # higher than the last one on file. run_number always increases across
      # runs of THIS workflow, which is exactly the property needed here —
      # nothing has to remember to bump a number by hand before submitting.
      - name: Build signed release .aab
        if: steps.gate.outputs.run == 'yes' && inputs.release == true
        working-directory: mobile/campistry-${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName="1.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'yes' && inputs.release == true
        with:
          name: campistry-${{ matrix.app }}-release-aab-${{ github.sha }}
          path: mobile/campistry-${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
