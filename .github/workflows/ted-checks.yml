# Ted's smoke alarm: runs every automated check on every push and pull request.
# A green ✓ next to a change on GitHub means all checks passed; a red ✗ means
# something is broken. Nothing is "done" while this is red.
name: Ted checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the SQL parser the migration checks use
        run: pip install pglast
      - name: Run all checks
        run: npm test
