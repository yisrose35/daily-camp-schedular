name: Mobile — iOS build

# Builds the two Campistry mobile apps on a GitHub-hosted macOS runner, so no
# Mac is needed locally. Capacitor 8's iOS template uses Swift Package Manager
# (not CocoaPods), so Xcode resolves dependencies on its own here.
#
# Two modes:
#   * Unsigned (default) — proves the app compiles. No Apple account needed.
#     Produces a .xcarchive artifact you cannot install on a device.
#   * Signed + TestFlight — set the secrets listed below and run with
#     `upload: true`. That is how you get the app onto your own iPhone from a
#     Windows machine: TestFlight, not a cable.
#
# Secrets required for the signed path (add under Settings → Secrets → Actions):
#   APPLE_CERTIFICATE_P12       base64 of your Apple Distribution .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_PROVISIONING_PROFILE  base64 of the App Store provisioning profile
#   APPSTORE_ISSUER_ID          App Store Connect API key issuer id
#   APPSTORE_KEY_ID             App Store Connect API key id
#   APPSTORE_PRIVATE_KEY        contents of the .p8 App Store Connect API key
#   APPLE_TEAM_ID               10-character Apple Developer team id

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        required: true
        default: both
        type: choice
        options: [both, lite, link]
      upload:
        description: Sign and upload to TestFlight (requires the Apple secrets)
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [lite, link]
    steps:
      - name: Skip unselected app
        id: gate
        run: |
          want='${{ inputs.app }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.app }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 22

      - name: Install Capacitor
        if: steps.gate.outputs.run == 'yes'
        working-directory: mobile/campistry-${{ matrix.app }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Sync web assets into the app bundle
        if: steps.gate.outputs.run == 'yes'
        working-directory: mobile/campistry-${{ matrix.app }}
        run: npm run sync

      # ── Unsigned compile check ───────────────────────────────────────────────
      - name: Build (unsigned)
        if: steps.gate.outputs.run == 'yes' && inputs.upload != true
        working-directory: mobile/campistry-${{ matrix.app }}/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive

      # ── Signed build + TestFlight ────────────────────────────────────────────
      - name: Import signing assets
        if: steps.gate.outputs.run == 'yes' && inputs.upload == true
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Archive and export (signed)
        if: steps.gate.outputs.run == 'yes' && inputs.upload == true
        working-directory: mobile/campistry-${{ matrix.app }}/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: steps.gate.outputs.run == 'yes' && inputs.upload == true
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export"/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          name: campistry-${{ matrix.app }}-ios-${{ inputs.upload == true && 'ipa' || 'archive' }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/App.xcarchive
          if-no-files-found: warn
